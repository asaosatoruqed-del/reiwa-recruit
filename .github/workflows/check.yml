name: Reiwa Recruit Crawler

on:
  schedule:
    - cron: '0 0 * * *' # 毎日1回（UTC 0:00 = 日本時間 朝9:00）自動実行
  workflow_dispatch:      # 手動でもボタン一つで実行可能

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests google-genai

      - name: Run Scraper and AI Parser
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Commit and push updated jobs.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git diff --staging --quiet || (git commit -m "Update jobs.json [skip ci]" && git push)
